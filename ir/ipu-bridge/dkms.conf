# Omarchy's own ipu-bridge for 7.2.5-3-omarchy (kernel.org v7.2.5 + linux-omarchy
# patches 0540/0541; same srcversion as the shipped module) plus one table entry
# for the HM1092 IR sensor, backported from mainline 4fdb0342f05e (in 7.3).
# ipu-bridge.c here already has that entry; the .patch file is for reference.
# Built for this one kernel only: a new kernel falls back to its stock module.
PACKAGE_NAME="ipu-bridge-himx"
PACKAGE_VERSION="7.2.5.3"
BUILT_MODULE_NAME[0]="ipu-bridge"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
AUTOINSTALL="no"
